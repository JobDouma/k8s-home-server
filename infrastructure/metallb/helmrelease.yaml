apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 10m
  chart:
    spec:
      chart: metallb
      version: "0.16.1"
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
  values:
    controller:
      enabled: true
      replicas: 0        # <-- scale to 0
    speaker:
      enabled: true
      replicas: 0        # <-- scale to 0
    crds:
      validationFailurePolicy: Ignore