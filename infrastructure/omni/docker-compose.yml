name: omni-on-prem
services:
  omni:
    container_name: omni
    image: ghcr.io/siderolabs/omni:v1.10.3
    restart: unless-stopped
    network_mode: host

    # Fix: with network_mode: host, the container still gets its OWN /etc/hosts,
    # it does NOT inherit the host's. auth.lan only resolves via DNS (Blocky,
    # 192.168.2.53) which is not guaranteed to be up, and the OIDC token exchange
    # is done server-side by this process, not by the browser. Pin it statically
    # so login doesn't depend on Blocky being healthy.
    extra_hosts:
      - "auth.lan:192.168.2.100"

    devices:
      - /dev/net/tun
    cap_add:
      - NET_ADMIN

    environment:
      - SSL_CERT_FILE=/etc/ssl/certs/homelab-ca.crt

    # Guardrail: this host only has 4GB total RAM. Without a limit, a runaway
    # container can OOM the whole VM (including sshd) instead of just itself.
    # These are Compose-spec `deploy.resources` limits - Compose V2 applies
    # them even outside swarm mode, no `docker stack` needed. Tune with
    # `docker stats omni` under real load and adjust if it's ever hitting the
    # ceiling.
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M

    # NOTE: omni.asc, tls.crt, tls.key and the etcd/sqlite data dirs are NOT
    # managed by this repo. They are sensitive, long-lived, host-local state.
    # See README.md for what they are and where they're backed up.
    volumes:
      - /opt/omni/etcd:/_out/etcd
      - /opt/omni/sqlite:/_out/sqlite
      - /opt/omni/omni.asc:/omni.asc
      - /opt/omni/tls.crt:/tls.crt
      - /opt/omni/tls.key:/tls.key
      - /usr/local/share/ca-certificates/homelab-ca.crt:/etc/ssl/certs/homelab-ca.crt:ro

    # REQUIRED since v1.7.1 - omni accepts a EULA via flags or it will not
    # start unattended. Replace CHANGE_ME with your actual name below.
    command: >
      --account-id=400d4180-9f90-479f-b0cd-aa3643f53765
      --name=homelab-omni
      --sqlite-storage-path=/_out/sqlite/omni.db
      --cert=/tls.crt
      --key=/tls.key
      --machine-api-cert=/tls.crt
      --machine-api-key=/tls.key
      --private-key-source=file:///omni.asc
      --event-sink-port=8091
      --bind-addr=0.0.0.0:443
      --machine-api-bind-addr=0.0.0.0:8090
      --k8s-proxy-bind-addr=0.0.0.0:8100
      --advertised-api-url=https://omni.lan/
      --advertised-kubernetes-proxy-url=https://omni.lan:8100/
      --siderolink-api-advertised-url=https://omni.lan:8090/
      --siderolink-wireguard-advertised-addr=192.168.2.12:50180
      --initial-users=jobdouma@hotmail.com
      --auth-auth0-enabled=false
      --auth-saml-enabled=false
      --auth-oidc-enabled=true
      --auth-oidc-provider-url=https://auth.lan/application/o/omni/
      --auth-oidc-client-id=omni-homelab
      --auth-oidc-allow-unverified-email=true
      --auth-oidc-client-secret=${OMNI_OIDC_CLIENT_SECRET}
      --eula-accept-name=job
      --eula-accept-email=jobdouma@hotmail.com
      --etcd-backup-s3
      --log-level=info

  # Garage — S3-compatible object store, used ONLY as the backend for Omni's
  # built-in etcd backup feature. Chosen over MinIO because MinIO's official
  # image was archived/frozen in April 2026; Garage is actively maintained and
  # purpose-built for exactly this (small, single-node self-hosted storage).
  #
  # IMPORTANT: metadata_dir (LMDB) lives on LOCAL disk under /opt/omni, NOT on
  # NFS. LMDB memory-maps its database file and assumes reliable POSIX
  # byte-range locking + coherent page cache, neither of which NFS reliably
  # provides. Running LMDB's metadata store over NFS is a known source of
  # lock-retry storms, hangs, and runaway memory/CPU use - Garage's own docs
  # recommend fast local/SSD storage for metadata specifically for this
  # reason. Only the actual object DATA (data_dir) is safe to put on NFS.
  #
  # Object data still lives on the NFS backups share, NOT in git - see
  # README.md. garage.toml's data_dir/metadata_dir paths are the
  # CONTAINER-side paths - the host-side paths are only ever referenced in
  # the volumes: mapping below, never inside the TOML.
  garage:
    image: dxflrs/garage:v2.3.0
    container_name: omni-backup-garage
    restart: unless-stopped
    stop_grace_period: 30s

    # Same rationale as omni above: bound this so a stuck LMDB-over-NFS retry
    # loop (or any other misbehavior) can't take the whole VM down. Garage's
    # own steady-state footprint for a single-node, small-scale S3 backend
    # like this is normally well under 256M; 512M gives headroom before you
    # hit the ceiling instead of the host's.
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

    ports:
      - "3900:3900"           # S3 API — Omni's --etcd-backup-s3-endpoint points here
      - "127.0.0.1:3903:3903" # Admin API — one-time layout/bucket/key setup only,
                               # per the original comment, so there's no reason to
                               # expose it beyond localhost. Reach it via
                               # `docker compose exec garage /garage ...` or an SSH
                               # tunnel if you need it remotely.
    volumes:
      - ./garage-config/garage.toml:/etc/garage.toml:ro
      - /opt/omni/garage-meta:/var/lib/garage/meta
      - /mnt/truenas-backups/ubuntu-server/omni/garage-data:/var/lib/garage/data