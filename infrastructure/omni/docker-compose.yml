name: omni-on-prem
services:
  omni:
    container_name: omni
    image: ghcr.io/siderolabs/omni:v1.12.2@sha256:4e961c2250f458b886d269731cd2b889f8fcaf8747d4542fa8b03e99c10e8276
    restart: unless-stopped
    network_mode: host
    extra_hosts:
      - auth.lan:192.168.2.100
      - omni.lan:192.168.2.12
    devices:
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    mem_limit: 1024m
    mem_reservation: 256m
    volumes:
      - /opt/omni/etcd:/_out/etcd
      - /opt/omni/sqlite:/_out/sqlite
      - /opt/omni/omni.asc:/omni.asc
      - /opt/omni/tls.crt:/tls.crt
      - /opt/omni/tls.key:/tls.key
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
    command:
      - --account-id=400d4180-9f90-479f-b0cd-aa3643f53765
      - --name=homelab-omni
      - --sqlite-storage-path=/_out/sqlite/omni.db
      - --cert=/tls.crt
      - --key=/tls.key
      - --machine-api-cert=/tls.crt
      - --machine-api-key=/tls.key
      - --private-key-source=file:///omni.asc
      - --event-sink-port=8091
      - --bind-addr=0.0.0.0:443
      - --machine-api-bind-addr=0.0.0.0:8090
      - --k8s-proxy-bind-addr=0.0.0.0:8100
      - --advertised-api-url=https://omni.lan/
      - --advertised-kubernetes-proxy-url=https://omni.lan:8100/
      - --machine-api-advertised-url=https://omni.lan:8090/
      - --siderolink-wireguard-advertised-addr=192.168.2.12:50180
      # OIDC (Auth0): requires AUTH0_DOMAIN, AUTH0_CLIENT_ID, AUTH0_CLIENT_SECRET in .env
      - --auth-oidc-enabled=true
      - --auth-oidc-provider-url=${AUTH0_DOMAIN}
      - --auth-oidc-client-id=${AUTH0_CLIENT_ID}
      - --auth-oidc-client-secret=${AUTH0_CLIENT_SECRET}
      - --auth-oidc-scopes=openid
      - --auth-oidc-scopes=profile
      - --auth-oidc-scopes=email
      - --auth-auth0-enabled=false
      - --auth-saml-enabled=false
      - --initial-users=admin@example.com
      - --eula-accept-name=job
      - --eula-accept-email=jobdouma@hotmail.com

  garage:
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    container_name: omni-backup-garage
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 512m
    mem_reservation: 128m
    ports:
      - 3900:3900
      - 127.0.0.1:3903:3903
    volumes:
      - ./garage-config/garage.toml:/etc/garage.toml:ro
      - /opt/omni/garage-meta:/var/lib/garage/meta
      - /mnt/truenas-backups/ubuntu-server/omni/garage-data:/var/lib/garage/data