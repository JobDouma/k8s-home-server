apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health {
            lameduck 5s
        }
        ready

        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
        }

        # Forward all non-cluster queries to Blocky's pinned Cilium LB IP,
        # then to public resolvers as a fallback if Blocky is unreachable.
        # 192.168.2.54 is reserved for Blocky in infrastructure/cilium/ippools.yaml (dns-pool)
        # — change it there first if it ever needs to move, then here.
        forward . 192.168.2.54 1.1.1.1 8.8.8.8 {
            policy sequential
            max_fails 3
            expire 30s
            health_check 5s
            prefer_udp
        }

        cache 300
        loop
        reload
        loadbalance
    }