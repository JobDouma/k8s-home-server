apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # ──────────────────────────────────────
  # Cilium
  # ──────────────────────────────────────
  - cilium/helmrepository.yaml
  - cilium/helmrelease.yaml 
  - cilium/ippools.yaml
  - cilium/l2-announcement.yaml 
  - cilium/certificate.yaml
  - cilium/ingressroute.yaml

  # ──────────────────────────────────────
  # Storage
  # ──────────────────────────────────────
  - storage/namespace.yaml
  - storage/pv-media.yaml
  - storage/pvc-media.yaml

  # ──────────────────────────────────────
  # Traefik
  # ──────────────────────────────────────
  - traefik/namespace.yaml
  - traefik/helmrepository.yaml
  - traefik/helmrelease.yaml
  - traefik/ingressroute.yaml
  - traefik/middlewares.yaml
  - traefik/servicemonitor.yaml
  - traefik/certificate.yaml
  - traefik/clusterrole.yaml


  # ──────────────────────────────────────
  # Kube Metrics Server
  # ──────────────────────────────────────
  - metrics-server/helmrepository.yaml
  - metrics-server/helmrelease.yaml

  # ──────────────────────────────────────
  # Cert Manager
  # ──────────────────────────────────────
  - cert-manager/namespace.yaml
  - cert-manager/helmrepository.yaml
  - cert-manager/helmrelease.yaml
  - cert-manager/ca-certificate.yaml
  - cert-manager/clusterissuer-ca.yaml
  - cert-manager/clusterissuer-selfsigned.yaml

  - local-path-storage

  # ──────────────────────────────────────
  # CoreDNS to Blocky
  # ──────────────────────────────────────
  - coredns/configmap.yaml
  - coredns/servicemonitor.yaml