apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 15m
  chart:
    spec:
      chart: cert-manager
      version: "v1.21.1"
      sourceRef:
        kind: HelmRepository
        name: cert-manager
        namespace: flux-system
  values:
    crds:
      enabled: true
    replicaCount: 1
    # ========== NEW: resources for all components ==========
    resources:
      # For the controller
      requests:
        memory: 64Mi
        cpu: 10m
      limits:
        memory: 256Mi
    cainjector:
      resources:
        requests:
          memory: 64Mi
          cpu: 10m
        limits:
          memory: 256Mi
    webhook:
      resources:
        requests:
          memory: 64Mi
          cpu: 10m
        limits:
          memory: 128Mi
    # =====================================================