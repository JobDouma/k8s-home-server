apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: cilium
      version: "1.20.5"   # Pin to stable release
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: kube-system
  values:
    kubeProxyReplacement: true
    k8sServiceHost: 192.168.2.22   # Your actual control-plane IP
    k8sServicePort: 6443
    ipam:
      mode: kubernetes
    l2announcements:
      enabled: true
    externalIPs:
      enabled: true
    hubble:
      enabled: true
      relay:
        enabled: true
      ui:
        enabled: true
    operator:
      replicas: 1