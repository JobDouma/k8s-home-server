# infrastructure/Cilium/helmrelease.yaml
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: cilium
      version: "1.20.5"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: kube-system
  values:
    # --- Core ---
    kubeProxyReplacement: true
    k8sServiceHost: 192.168.2.22          # your control-plane IP
    k8sServicePort: 6443

    # --- IPAM ---
    ipam:
      mode: kubernetes                     # uses Kubernetes PodCIDR from nodes

    # --- LoadBalancer (L2) ---
    # Enable Cilium's L2 announcements; we'll create an IP pool later if you drop MetalLB.
    l2announcements:
      enabled: true
    externalIPs:
      enabled: true                        # allow assigning external IPs

    # --- Hubble (observability) ---
    hubble:
      enabled: true
      relay:
        enabled: true
      ui:
        enabled: true

    # --- Operator ---
    operator:
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

    # --- Agent resources ---
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    # --- Optional: tune for small clusters ---
    rollOutCiliumPods: true
    enableIPv4Masquerade: true