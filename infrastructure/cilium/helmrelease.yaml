apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: cilium
      version: 1.20.1
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: kube-system
  values:
    devices: "ens18"
    masqueradeInterfaces: "ens18"
    kubeProxyReplacement: true
    k8sServiceHost: 192.168.2.22
    k8sServicePort: 6443
    ipam:
      mode: kubernetes
    l2announcements:
      enabled: true
    externalIPs:
      enabled: true
    hubble:
      enabled: true
      relay:
        enabled: true
        replicas: 1
      ui:
        enabled: true

    image:
      repository: quay.io/cilium/cilium
      tag: v1.20.1
      digest: "sha256:ae9ea21f7427fe24bc6ea7247eb552157a1b0a431744045d3f641545ca71d11b"
      useDigest: true

    operator:
      replicas: 1
      image:
        repository: quay.io/cilium/operator-generic
        tag: v1.20.1
        useDigest: true
        digest: "sha256:6c3885fc7b629099fdbe2a5c87869c86feb825fa18fae299eac0f61918d16ecf"
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 1Gi
          
    rollOutCiliumPods: true
    enableIPv4Masquerade: true