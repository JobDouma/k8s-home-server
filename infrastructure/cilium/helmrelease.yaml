apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: cilium
      version: 1.20.1
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: kube-system
  values:
    # --- Core ---
    kubeProxyReplacement: true
    k8sServiceHost: 192.168.2.22
    k8sServicePort: 6443

    ipam:
      mode: kubernetes

    # --- L2 announcements (optional, keep if you want) ---
    l2announcements:
      enabled: true
    externalIPs:
      enabled: true

    # --- Hubble ---
    hubble:
      enabled: true
      relay:
        enabled: true
      ui:
        enabled: true

    # --- Auto‑mount BPF and cgroup ---
    cgroup:
      autoMount: true
    bpf:
      autoMount: true

    # --- Explicit host mounts (redundant with autoMount, but safe) ---
    hostMounts:
      - name: bpf-mount
        mountPath: /sys/fs/bpf
        hostPath: /sys/fs/bpf
      - name: cilium-run
        mountPath: /run/cilium
        hostPath: /run/cilium

    # --- Images ---
    image:
      repository: cilium/cilium
      tag: v1.20.1
      digest: sha256:ae9ea21f7427fe24bc6ea7247eb552157a1b0a431744045d3f641545ca71d11b

    operator:
      replicas: 1
      image:
        repository: cilium/operator
        tag: v1.20.1
        digest: sha256:67adaf5575902dcce31dc36ba5b5acad397a8b40ec986b55696c94f80b6d861d
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

    # --- Agent resources ---
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    # --- Critical: set privileged mode for both agent and init containers ---
    securityContext:
      privileged: true
    initContainers:
      securityContext:
        privileged: true

    rollOutCiliumPods: true
    enableIPv4Masquerade: true