apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
  namespace: authentik
spec:
  interval: 15m
  timeout: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: authentik
      version: 2026.8.2
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: flux-system
  values:
    global:
      env:
        - name: AUTHENTIK_REDIS__HOST
          value: authentik-redis-master

    blueprints:
      enabled: true
      secrets:
        - authentik-blueprints

    prometheus:
      rules:
        create: false

    authentik:
      existingSecret:
        secretName: authentik-secret
      error_reporting:
        enabled: false
      web:
        path: /

    server:
      strategy:
        type: Recreate
      revisionHistoryLimit: 2
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
          interval: 120s
          scrapeTimeout: 10s
      replicas: 1
      podAnnotations:
        configmap.reloader.stakater.com/reload: authentik-blueprints
      resources:
        requests:
          cpu: 30m
          memory: 512Mi
        limits:
          cpu: 750m
          memory: 1Gi
      tolerations: []
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: authentik
                    app.kubernetes.io/component: server
                topologyKey: kubernetes.io/hostname
      startupProbe:
        failureThreshold: 120
        periodSeconds: 10
        timeoutSeconds: 10

    worker:
      strategy:
        type: Recreate
      revisionHistoryLimit: 2
      replicas: 1
      podAnnotations:
        configmap.reloader.stakater.com/reload: authentik-blueprints
      resources:
        requests:
          cpu: 50m
          memory: 512Mi
        limits:
          cpu: 300m
          memory: 1536Mi
      tolerations: []
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: authentik
                    app.kubernetes.io/component: worker
                topologyKey: kubernetes.io/hostname
      startupProbe:
        failureThreshold: 120
        periodSeconds: 10
        timeoutSeconds: 10

    postgresql:
      enabled: true
      volumePermissions:
        enabled: false
      primary:
        podSecurityContext:
          enabled: true
          fsGroup: 1001
        containerSecurityContext:
          enabled: true
          runAsUser: 1001
        persistence:
          enabled: true
          storageClass: local-path
          size: 10Gi
        # extendedConfiguration has been removed – this was the trigger
        # for the init-chmod-data container that was failing.
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      auth:
        username: authentik
        database: authentik
        existingSecret: authentik-postgresql-secret

    redis:
      enabled: true
      auth:
        enabled: false
      master:
        podSecurityContext:
          enabled: true
          fsGroup: 1001
        containerSecurityContext:
          enabled: true
          runAsUser: 1001
        persistence:
          enabled: true
          storageClass: local-path
          size: 1Gi
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 256Mi
        args:
          - --appendonly yes
          - --appendfsync everysec