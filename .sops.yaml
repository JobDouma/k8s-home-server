# .sops.yaml
# Rule order is significant: SOPS uses the FIRST matching path_regex.
# Place the most specific rules first; end with a catch-all if desired.

creation_rules:
  # ── Runbooks (plaintext, no encryption) ──────────────────────
  # If you never want these encrypted, remove this rule entirely.
  # As written, it would encrypt runbooks. Delete it if that is
  # not what you want.
  # - path_regex: ^runbooks/.*\.ya?ml$
  #   age: age156h3vmsrtye8590hgdx6kaqeymwyu5qtsw7vq664lyf3jt5am9asvkp4gf

  # ── Kubernetes Secret manifests ───────────────────────────────
  # Matches files whose name ends in "secret" (singular or plural),
  # or that contain ".secret." anywhere. Narrower than your original
  # pattern, so unrelated YAML is not accidentally encrypted.
  - path_regex: '(^|/)secret(s)?\.ya?ml$|\.secret\.ya?ml$'
    encrypted_regex: '^(data|stringData)$'
    age: age156h3vmsrtye8590hgdx6kaqeymwyu5qtsw7vq664lyf3jt5am9asvkp4gf

  # ── Fully encrypted config files ──────────────────────────────
  - path_regex: '\.sops\.ya?ml$'
    age: age156h3vmsrtye8590hgdx6kaqeymwyu5qtsw7vq664lyf3jt5am9asvkp4gf

  # ── Cosign private keys ───────────────────────────────────────
  - path_regex: '(^|/)cosign\.key(\.sops)?$'
    age: age156h3vmsrtye8590hgdx6kaqeymwyu5qtsw7vq664lyf3jt5am9asvkp4gf

  # ── Catch-all (optional) ──────────────────────────────────────
  # If you want any other .sops.yaml file to be encrypted.
  # Remove if you prefer "no matching rule" errors for unexpected files.
  # - path_regex: '.*'
  #   age: age156h3vmsrtye8590hgdx6kaqeymwyu5qtsw7vq664lyf3jt5am9asvkp4gf