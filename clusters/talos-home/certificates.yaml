# clusters/talos-home/certificates.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: certificates
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/certificates
  prune: true
  dependsOn:
    - name: cert-manager      # CRDs exist before this runs
  sourceRef:
    kind: GitRepository
    name: flux-system