# clusters/talos-home/cert-manager.yaml
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/cert-manager
  prune: true
  wait: true          # blocks until HelmRelease is Ready
  sourceRef:
    kind: GitRepository
    name: flux-system