apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: falco
  namespace: falco
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - falco
  selector:
    matchLabels:
      app.kubernetes.io/name: falco
  endpoints:
    - port: metrics   # Falco exposes metrics on port 8765 with name "metrics"
      path: /metrics
      interval: 90s