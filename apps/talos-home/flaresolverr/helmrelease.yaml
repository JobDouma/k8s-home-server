apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flaresolverr
  namespace: flaresolverr
spec:
  interval: 15m
  timeout: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      strategy: uninstall
      retries: 3
  chart:
    spec:
      chart: app-template
      version: "5.2.1"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      flaresolverr:
        containers:
          app:
            image:
              repository: ghcr.io/flaresolverr/flaresolverr
              tag: v3.5.2@sha256:4ad0ed7de64622f9823594bf7bc237149158fca881f875aafbdd8456f6467134
              pullPolicy: IfNotPresent
            env:
              LOG_LEVEL: info
              CAPTCHA_SOLVER: none
              TZ: Europe/Amsterdam
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                cpu: 1000m
                memory: 1Gi
            ports:
              - name: http
                containerPort: 8191
                protocol: TCP
            securityContext:                    # <-- new block
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            probes:
              liveness:
                enabled: true
                spec:
                  httpGet:
                    path: /health
                    port: 8191
                  initialDelaySeconds: 30
                  periodSeconds: 10
              readiness:
                enabled: true
                spec:
                  httpGet:
                    path: /health
                    port: 8191
                  initialDelaySeconds: 10
                  periodSeconds: 5
    service:
      app:
        controller: flaresolverr
        type: ClusterIP
        ports:
          http:
            port: 8191
            targetPort: http
    persistence: {}