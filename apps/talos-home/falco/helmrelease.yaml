apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: falco
  namespace: falco
spec:
  interval: 15m
  dependsOn:
    - name: loki
      namespace: monitoring
    - name: falcosidekick
      namespace: falco
  chart:
    spec:
      chart: falco
      version: "9.1.0"
      sourceRef:
        kind: HelmRepository
        name: falcosecurity
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    driver:
      kind: modern_ebpf

    falco:
      json_output: true
      log_level: info
      existingRulesConfigMaps:
        - falco-rules
        - falco-custom-rules
      http_output:
        enabled: true
        url: "http://falcosidekick.falco.svc.cluster.local:2801"

    daemonset:
      tolerations:
        - operator: Exists
      podAnnotations: {}
      # increase resources for the falco container and the sidecar
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi

    falcosidekick:
      enabled: false

    # The sidecar container (falcoctl-artifact-follow) also needs resources
    artifact:
      follow:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi