apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: falcosidekick
  namespace: falco
spec:
  interval: 15m
  maxHistory: 2
  dependsOn:
    - name: loki
      namespace: monitoring
  chart:
    spec:
      chart: falcosidekick
      version: "0.14.0"
      sourceRef:
        kind: HelmRepository
        name: falcosecurity
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: Secret
      name: falcosidekick-values
      valuesKey: values.yaml
  values:
    replicaCount: 1
    tolerations:
      - operator: Exists
      - key: "node.kubernetes.io/not-ready"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 60
      - key: "node.kubernetes.io/unreachable"
        operator: "Exists"
        effect: "NoExecute"
        tolerationSeconds: 60

    podAnnotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "2801"

    config:
      loki:
        hostport: "http://loki-gateway.monitoring.svc.cluster.local"  # corrected from previous
        minimumpriority: "warning"
      # Remove any other outputs that may be misconfigured

    webui:
      enabled: true
      replicaCount: 1
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi

    serviceMonitor:
      enabled: true

    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi