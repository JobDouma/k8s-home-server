apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
  namespace: media
  annotations:
    fluxcd.io/version: "v3"
spec:
  interval: 15m
  timeout: 20m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      main:
        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          affinity:
            podAntiAffinity:
              # Changed from `required` to `preferred`: `required` can block
              # scheduling entirely on small/single-node clusters during
              # rollouts, since a second pod briefly needs a second node.
              preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: qbittorrent
                  topologyKey: kubernetes.io/hostname
        initContainers:
          fix-perms:
            image:
              repository: busybox
              tag: latest
            command:
              - sh
              - -c
              - |
                mkdir -p /config/qBittorrent/logs
                chown -R 1000:1000 /config /downloads
                rm -f /config/qBittorrent/qbittorrent.lock || true
                echo "Permissions fixed and lock removed."
            securityContext:
              runAsUser: 0
        containers:
          main:
            image:
              repository: ghcr.io/onedr0p/qbittorrent
              tag: 5.0.4@sha256:17e3e5f1c7e7fe81434f9d1f5f2e00da9a67f6dbfda1c988c0619932cb856047
            # Pinned to match the fix-perms chown (1000:1000). Without this,
            # the container's default user may not match the chowned
            # directories, causing it to fail permission checks and exit
            # cleanly (Exit Code 0) instead of erroring loudly.
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
            envFrom:
            - secretRef:
                name: qbittorrent-webui
            env:
              - name: TZ
                value: Europe/Amsterdam
              - name: QBITTORRENT__LOG__LEVEL
                value: "DEBUG"
              - name: QBITTORRENT__NO_HOSTS_CHECK
                value: "1"
              - name: QBITTORRENT__PORT
                value: '8080'
              - name: QBITTORRENT__BT_PORT
                value: '6881'
              - name: QBITTORRENT__WEBUI__ADDRESS
                value: 0.0.0.0
              - name: QBITTORRENT__WEBUI__USERNAME
                valueFrom:
                  secretKeyRef:
                    name: qbittorrent-webui
                    key: QBITTORRENT_USER
              - name: QBITTORRENT__WEBUI__PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: qbittorrent-webui
                    key: QBITTORRENT_PASS
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
            ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: bt
              containerPort: 6881
              protocol: TCP
            # No probes existed before, so kubelet had no way to know the
            # container was actually failing to serve traffic. tcpSocket is
            # used instead of httpGet since the WebUI can be slow to bind
            # and auth pages complicate simple HTTP checks.
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8080
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 30
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8080
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8080
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 5
          exporter:
            image:
              repository: ghcr.io/esanchezm/prometheus-qbittorrent-exporter
              tag: v1.7.0@sha256:02dbf86bd2850dcb94e7df5684159b954386e978e20f6b473f92efa62335f552
            envFrom:
            - secretRef:
                name: qbittorrent-webui
            env:
              - name: QBITTORRENT_HOST
                value: 127.0.0.1
              - name: QBITTORRENT_PORT
                value: '8080'
              - name: QBITTORRENT_URL_BASE
                value: ''
              - name: EXPORTER_PORT
                value: '8000'
            ports:
            - name: metrics
              containerPort: 8000
              protocol: TCP
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          http:
            port: 8080
            protocol: TCP
            targetPort: http
          bt:
            port: 6881
            protocol: TCP
            targetPort: bt
          metrics:
            port: 8000
            protocol: TCP
            targetPort: metrics
    persistence:
      config:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: qbittorrent-config
        globalMounts:
          - path: /config
      downloads:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: media
        globalMounts:
          - path: /downloads
            subPath: downloads