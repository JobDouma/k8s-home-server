apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
  namespace: media
  annotations:
    fluxcd.io/version: "v2"   # <-- ADD this to force new upgrade
spec:
  interval: 15m
  timeout: 20m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      main:
        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
            # Do NOT set runAsNonRoot – the qbittorrent image handles it internally.
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: qbittorrent
                topologyKey: kubernetes.io/hostname
        containers:
          main:
            image:
              repository: ghcr.io/onedr0p/qbittorrent
              tag: 5.0.4@sha256:17e3e5f1c7e7fe81434f9d1f5f2e00da9a67f6dbfda1c988c0619932cb856047
            envFrom:
            - secretRef:
                name: qbittorrent-webui
            env:
              - name: TZ
                value: Europe/Amsterdam
              - name: QBITTORRENT__PORT
                value: '8080'
              - name: QBITTORRENT__BT_PORT
                value: '6881'
              - name: QBITTORRENT__WEBUI__ADDRESS
                value: 0.0.0.0
              - name: QBITTORRENT__WEBUI__USERNAME
                valueFrom:
                  secretKeyRef:
                    name: qbittorrent-webui
                    key: QBITTORRENT_USER
              - name: QBITTORRENT__WEBUI__PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: qbittorrent-webui
                    key: QBITTORRENT_PASS
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
            ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: bt
              containerPort: 6881
              protocol: TCP
          exporter:
            image:
              repository: ghcr.io/esanchezm/prometheus-qbittorrent-exporter
              tag: v1.7.0@sha256:02dbf86bd2850dcb94e7df5684159b954386e978e20f6b473f92efa62335f552
            envFrom:
            - secretRef:
                name: qbittorrent-webui
            env:
              - name: QBITTORRENT_HOST
                value: 127.0.0.1
              - name: QBITTORRENT_PORT
                value: '8080'
              - name: QBITTORRENT_URL_BASE
                value: ''
              - name: EXPORTER_PORT
                value: '8000'
            ports:
            - name: metrics
              containerPort: 8000
              protocol: TCP
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          http:
            port: 8080
            protocol: TCP
            targetPort: http
          bt:
            port: 6881
            protocol: TCP
            targetPort: bt
          metrics:
            port: 8000
            protocol: TCP
            targetPort: metrics
    persistence:
      config:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: qbittorrent-config
        globalMounts:
        - path: /config
      downloads:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: media
        globalMounts:
        - path: /downloads
          subPath: downloads