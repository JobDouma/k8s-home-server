apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
  namespace: monitoring
  annotations:
    homelab.io/rollout: "2026-09-13-3"
spec:
  interval: 30m
  timeout: 60m
  dependsOn:
  - name: loki
    namespace: monitoring
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: 0.92.1
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    fullnameOverride: vm-stack
    syncJob:
      resources:
        limits:
          memory: 128Mi
        requests:
          memory: 64Mi
    victoria-metrics-operator:
      enabled: true
      fullnameOverride: vm-operator
      crds:
        plain: true
      operator:
        disable_prometheus_converter: false
      admissionWebhooks:
        enabled: false
    vmsingle:
      enabled: true
      spec:
        retentionPeriod: 5d
        storage:
          accessModes:
          - ReadWriteOnce
          storageClassName: local-path
          resources:
            requests:
              storage: 20Gi
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        tolerations:
        - operator: Exists
    vmagent:
      enabled: true
      spec:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        tolerations:
        - operator: Exists
        extraArgs:
          promscrape.streamParse: 'true'
    vmalert:
      enabled: true
      spec:
        evaluationInterval: 60s
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
    alertmanager:
      enabled: true
      spec:
        configSecret: alertmanager-gotify-config
        templates: []
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 50m
            memory: 128Mi
        tolerations:
        - operator: Exists
    grafana:
      enabled: true
      replicas: 1
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 600
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 600
      deploymentStrategy:
        type: Recreate
      grafana.ini:
        unified_alerting:
          enabled: false
        alerting:
          enabled: false
      # Grafana 13.x does heavy work at startup: 713 SQLite migrations
      # plus installing 10+ plugins back-to-back. Peak RSS easily
      # exceeds 1Gi during that window. The old 768Mi limit was the
      # reason the main container now OOMKills alongside the sidecar.
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 2Gi
      datasources:
        datasources.yaml:
          apiVersion: 1
          datasources:
          - name: VictoriaMetrics
            type: prometheus
            uid: prometheus
            url: http://vmsingle-vm-stack.monitoring.svc.cluster.local:8428
            access: proxy
            isDefault: true
            jsonData:
              timeInterval: 60s
          - name: Loki
            type: loki
            uid: loki
            url: http://loki-gateway.monitoring.svc.cluster.local
            access: proxy
            isDefault: false
            jsonData:
              maxLines: 1000
      sidecar:
        # k8s-sidecar 2.8.1 watching ALL namespaces for
        # grafana_dashboard=1 is memory-hungry on a cluster with many
        # ConfigMaps. 64Mi -> OOM within seconds. 256Mi still wasn't
        # enough once we actually rendered it. 512Mi leaves headroom.
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 512Mi
        dashboards:
          enabled: true
          searchNamespace: ALL
          label: grafana_dashboard
          labelValue: '1'
          folderAnnotation: grafana_folder
          provider:
            foldersFromFilesStructure: true
        datasources:
          enabled: false
      admin:
        existingSecret: grafana-admin
      persistence:
        enabled: false
    prometheus-node-exporter:
      hostRootFsMount:
        enabled: false
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi
    kube-state-metrics:
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 256Mi
      startupProbe:
        enabled: true
        failureThreshold: 30
        periodSeconds: 10
    vmcluster:
      enabled: false
    vmauth:
      enabled: false