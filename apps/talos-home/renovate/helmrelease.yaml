apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate
  namespace: renovate
spec:
  interval: 1h
  timeout: 20m
  chart:
    spec:
      chart: renovate
      version: "46.264.2"
      sourceRef:
        kind: HelmRepository
        name: renovate
        namespace: flux-system
  values:
    cronjob:
      schedule: "10 3 * * *"
      concurrencyPolicy: Forbid
      successfulJobsHistoryLimit: 0
      failedJobsHistoryLimit: 1
      ttlSecondsAfterFinished: 300
    envFrom:
      - secretRef:
          name: renovate-secret
    env:
      LOG_LEVEL: info
    renovate:
      image:
        repository: ghcr.io/renovatebot/renovate
        tag: "44.50.3@sha256:cea67b5dd9f40ffbca2d51a34162e2369a80c4027c6de5f3f5f3b6793ae4a07b"
      config: |
        {
          "$schema": "https://docs.renovatebot.com/renovate-schema.json",
          "platform": "github",
          "repositories": ["jobdouma/k8s-home-server"],
          "autodiscover": false,
          "onboarding": false,
          "requireConfig": "optional",
          "dependencyDashboard": true,
          "pinDigests": true,
          "baseBranchPatterns": ["main"],
          "schedule": ["after 3am and before 5am"],
          "prCreation": "immediate",
          "prHourlyLimit": 10,
          "prConcurrentLimit": 15,
          "rebaseWhen": "conflicted",
          "gitAuthor": "JobDouma <7521465+JobDouma@users.noreply.github.com>",
          "enabledManagers": [
            "flux",
            "helm-values",
            "kubernetes",
            "custom.regex"
          ],
          "customManagers": [
            {
              "customType": "regex",
              "description": "code-server version tracking",
              "managerFilePatterns": [
                "/(^|/)infrastructure/vs-code/version\\.ya?ml$/"
              ],
              "matchStrings": [
                "code_server_version: \"(?<currentValue>[\\d.]+)\""
              ],
              "depNameTemplate": "coder/code-server",
              "datasourceTemplate": "github-releases",
              "versioningTemplate": "semver"
            },
            {
              "customType": "regex",
              "description": "gitleaks docker image version tracking for pre-commit hook",
              "managerFilePatterns": [
                "/(^|/)\\.githooks/pre-commit$/"
              ],
              "matchStrings": [
                "GITLEAKS_IMAGE=\"zricethezav/gitleaks:(?<currentValue>v[0-9.]+)\""
              ],
              "depNameTemplate": "zricethezav/gitleaks",
              "datasourceTemplate": "docker",
              "versioningTemplate": "docker"
            }
          ],
          "platformAutomerge": true,
          "automergeStrategy": "squash",
          "flux": {
            "managerFilePatterns": [
              "/(^|/)clusters/.+\\.ya?ml$/",
              "/(^|/)infrastructure/.+\\.ya?ml$/",
              "/(^|/)apps/.+\\.ya?ml$/"
            ],
            "pinDigests": true
          },
          "helm-values": {
            "managerFilePatterns": [
              "/(^|/)apps/.+\\.ya?ml$/",
              "/(^|/)infrastructure/.+\\.ya?ml$/"
            ]
          },
          "kubernetes": {
            "managerFilePatterns": [
              "/(^|/)apps/.+\\.ya?ml$/",
              "/(^|/)infrastructure/.+\\.ya?ml$/"
            ]
          },
          "packageRules": [
            {
              "matchUpdateTypes": ["minor", "patch", "digest"],
              "groupName": "all non-major updates",
              "groupSlug": "all-non-major",
              "automerge": true,
              "automergeType": "pr",
              "platformAutomerge": true,
              "labels": ["automerge"]
            },
            {
              "matchUpdateTypes": ["major"],
              "automerge": false,
              "labels": ["major-update"]
            }
          ]
        }
      # ========== NEW ==========
      resources:
        requests:
          memory: 256Mi
        limits:
          memory: 512Mi
      # =========================