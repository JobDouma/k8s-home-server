apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate
  namespace: renovate
spec:
  interval: 1h
  timeout: 20m
  chart:
    spec:
      chart: renovate
      version: "46.279.10"
      sourceRef:
        kind: HelmRepository
        name: renovate
        namespace: flux-system
  values:
    cronjob:
      schedule: "10 3 * * *"
      concurrencyPolicy: Forbid
      successfulJobsHistoryLimit: 1
      failedJobsHistoryLimit: 1
      ttlSecondsAfterFinished: 1800
      # Grace window if the node/cluster is briefly unavailable right at 3:10 —
      # without this, a missed trigger time is just skipped for the day.
      startingDeadlineSeconds: 600
      # Hard kill-switch in case a run hangs (API stall, rate-limit backoff, etc.)
      # so it can't silently run forever past the intended 3am-5am schedule window.
      activeDeadlineSeconds: 5400

    envFrom:
      - secretRef:
          name: renovate-secret
    env:
      # NOTE: still set to debug to diagnose why the last clean run created no PRs.
      # Drop back to "info" once that's resolved.
      LOG_LEVEL: debug
      NODE_OPTIONS: "--max-old-space-size=2560"

    # ===== these are top-level chart values, not nested under `renovate:` =====
    image:
      repository: renovatebot/renovate
      registry: ghcr.io
      tag: "44.69.13@sha256:9191c8ba152484974a9faef9e22978a98cc0fc52d16756841816c5f947cd09d2"

    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        memory: 3Gi

    securityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault

    renovate:
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL

      # Optional: caches repo/package data between runs to speed up repeat
      # extraction and reduce GitHub API calls. Requires a StorageClass capable
      # of provisioning a small PVC in this namespace. Remove this block if you
      # don't want the extra PVC.
      persistence:
        cache:
          enabled: true
          size: 2Gi
          storageClass: truenas-nfs

      config: |
        {
          "$schema": "https://docs.renovatebot.com/renovate-schema.json",
          "platform": "github",
          "repositories": ["jobdouma/k8s-home-server"],
          "autodiscover": false,
          "onboarding": false,
          "requireConfig": "optional",
          "dependencyDashboard": true,
          "pinDigests": true,
          "baseBranchPatterns": ["main"],
          "schedule": ["after 3am and before 5am"],
          "prCreation": "immediate",
          "prHourlyLimit": 10,
          "prConcurrentLimit": 15,
          "rebaseWhen": "conflicted",
          "gitAuthor": "JobDouma <7521465+JobDouma@users.noreply.github.com>",
          "enabledManagers": [
            "flux",
            "helm-values",
            "kubernetes",
            "custom.regex"
          ],
          "customManagers": [
            {
              "customType": "regex",
              "description": "code-server version tracking",
              "managerFilePatterns": [
                "/(^|/)infrastructure/vs-code/version\\.ya?ml$/"
              ],
              "matchStrings": [
                "code_server_version: \"(?<currentValue>[\\d.]+)\""
              ],
              "depNameTemplate": "coder/code-server",
              "datasourceTemplate": "github-releases",
              "versioningTemplate": "semver"
            },
            {
              "customType": "regex",
              "description": "gitleaks docker image version tracking for pre-commit hook",
              "managerFilePatterns": [
                "/(^|/)\\.githooks/pre-commit$/"
              ],
              "matchStrings": [
                "GITLEAKS_IMAGE=\"zricethezav/gitleaks:(?<currentValue>v[0-9.]+)\""
              ],
              "depNameTemplate": "zricethezav/gitleaks",
              "datasourceTemplate": "docker",
              "versioningTemplate": "docker"
            }
          ],
          "platformAutomerge": true,
          "automergeStrategy": "squash",
          "flux": {
            "managerFilePatterns": [
              "/(^|/)clusters/.+\\.ya?ml$/",
              "/(^|/)infrastructure/.+\\.ya?ml$/",
              "/(^|/)apps/.+\\.ya?ml$/"
            ],
            "pinDigests": true
          },
          "helm-values": {
            "managerFilePatterns": [
              "/(^|/)apps/.+\\.ya?ml$/",
              "/(^|/)infrastructure/.+\\.ya?ml$/"
            ]
          },
          "kubernetes": {
            "managerFilePatterns": [
              "/(^|/)apps/.+\\.ya?ml$/",
              "/(^|/)infrastructure/.+\\.ya?ml$/"
            ]
          },
          "packageRules": [
            {
              "matchUpdateTypes": ["minor", "patch", "digest"],
              "groupName": "all non-major updates",
              "groupSlug": "all-non-major",
              "automerge": true,
              "automergeType": "pr",
              "platformAutomerge": true,
              "labels": ["automerge"]
            },
            {
              "matchUpdateTypes": ["major"],
              "automerge": false,
              "labels": ["major-update"]
            }
          ]
        }