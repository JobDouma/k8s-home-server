apiVersion: tailscale.com/v1alpha1
kind: Connector
metadata:
  name: homelab-subnet-router
  namespace: tailscale
  labels:
    app.kubernetes.io/managed-by: flux
spec:
  hostnamePrefix: talos-home-subnet

  # 2 active subnet router replicas — one can restart without dropping LAN access
  replicas: 2

  # Apply metrics + resource limits from the ProxyClass above
  proxyClass: homelab

  # tag:k8s is owned by tag:k8s-operator — correct, do NOT use tag:k8s-operator here
  tags:
    - tag:k8s

  subnetRouter:
    advertiseRoutes:
      # --- Web apps behind Traefik ---
      - 192.168.2.100/32  # traefik (dashy, jellyfin, jellyseerr, radarr, sonarr,
                           # qbittorrent, prowlarr, prometheus, grafana, joplin,
                           # traefik, blocky-ui, freshrss, auth, falco, gotify,
                           # immich, uptime-kuma, argus — all .lan names)

      # --- Direct infra IPs, not behind Traefik ---
      - 192.168.2.54/32   # blocky (DNS)
      - 192.168.2.5/32    # truenas.lan
      - 192.168.2.254/32  # router.lan
      - 192.168.2.12/32   # omni.lan (runs on ubuntu-server host itself)

      # --- Pod CIDR, for direct pod/service access (Hubble, in-cluster tools, etc) ---
      - 10.244.0.0/16