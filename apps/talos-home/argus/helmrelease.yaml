apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argus
  namespace: argus
spec:
  interval: 15m
  timeout: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    controllers:
      main:
        containers:
          main:
            image:
              repository: aceberg/watchyourports
              tag: 0.1.2@sha256:fea1667950710ae9cb4ce9a68156dde1ff4b53438d17dbda774925881a0f12ff
            env:
              TZ: Europe/Amsterdam
              # Optional: adjust scan interval (default 10 minutes)[reference:4]
              # TIMEOUT: "10"
              # HIST_TRIM: "90"
            ports:
              - name: http
                containerPort: 8853
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8853
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8853
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 100m
                memory: 128Mi
    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          http:
            port: 8853
    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        storageClass: local-path
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /data/WatchYourPorts