apiVersion: v1
kind: ConfigMap
metadata:
  name: argus-hosts
  namespace: argus
data:
  hosts.yaml: |
    # ──────────────────────────────────────
    # TrueNAS (192.168.2.5)
    # ──────────────────────────────────────
    192.168.2.5:
      name: truenas
      addr: 192.168.2.5
      portmap:
        443:
          name: TrueNAS Web UI
          port: 443
          state: false
          watch: true
        22:
          name: SSH
          port: 22
          state: false
          watch: true

    # ──────────────────────────────────────
    # Router / Gateway (192.168.2.254)
    # ──────────────────────────────────────
    192.168.2.254:
      name: router
      addr: 192.168.2.254
      portmap:
        443:
          name: Router Web UI
          port: 443
          state: false
          watch: true
        53:
          name: DNS
          port: 53
          state: false
          watch: true

    # ──────────────────────────────────────
    # Omni (192.168.2.12)
    # ──────────────────────────────────────
    192.168.2.12:
      name: omni
      addr: 192.168.2.12
      portmap:
        443:
          name: Omni Web UI
          port: 443
          state: false
          watch: true
        8090:
          name: Omni API
          port: 8090
          state: false
          watch: true

    # ──────────────────────────────────────
    # Kubernetes Nodes
    # ──────────────────────────────────────
    192.168.2.22:
      name: talos-cp-1
      addr: 192.168.2.22
      portmap:
        6443:
          name: Kubernetes API
          port: 6443
          state: false
          watch: true
        50000:
          name: Talos API
          port: 50000
          state: false
          watch: true

    192.168.2.6:
      name: talos-wk-1
      addr: 192.168.2.6
      portmap:
        6443:
          name: Kubernetes API
          port: 6443
          state: false
          watch: true
        50000:
          name: Talos API
          port: 50000
          state: false
          watch: true