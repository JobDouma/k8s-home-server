apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: dns
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Allow Blocky to talk to upstream DNS servers (over TCP/UDP 53)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: blocky-egress
  namespace: dns
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: blocky
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow Blocky to talk to Redis (same namespace)
    - to:
        - podSelector:
            matchLabels:
              app: redis-blocky
      ports:
        - port: 6379
---
# Allow Redis to be reached only by Blocky
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-ingress
  namespace: dns
spec:
  podSelector:
    matchLabels:
      app: redis-blocky
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: blocky
      ports:
        - port: 6379