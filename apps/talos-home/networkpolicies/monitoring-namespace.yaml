apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Allow ingress from Traefik to Grafana (port 80) and Prometheus (port 8428)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-ingress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vm-stack-grafana   # adjust if different
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
      ports:
        - port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-ingress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vmsingle-vm-stack   # adjust to your VMSingle pod label
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
      ports:
        - port: 8428
---
# Allow VMAgent to egress to VMSingle for remote write
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vmagent-egress
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vmagent   # adjust label
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmsingle-vm-stack
      ports:
        - port: 8428
---
# Allow VMAgent to scrape metrics from other namespaces (optional)
# Usually VMAgent scrapes via ServiceMonitors, so it needs to reach pods across namespaces.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vmagent-scrape
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vmagent
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - port: 80
        - port: 443
        - port: 9090
        - port: 8080
        # add any other metrics ports your apps expose
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP