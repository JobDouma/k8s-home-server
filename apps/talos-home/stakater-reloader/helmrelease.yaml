apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
  namespace: kube-system
spec:
  interval: 15m
  timeout: 10m

  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3

  chart:
    spec:
      chart: reloader
      version: "2.2.16"
      sourceRef:
        kind: HelmRepository
        name: stakater
        namespace: flux-system

  values:
    reloader:
      watchGlobally: true
      reloadOnCreate: true

    # ========== NEW: Resources ==========
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
    # ====================================

    podSecurityContext:
      runAsNonRoot: true

    securityContext:
      allowPrivilegeEscalation: false