apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyseerr
  namespace: media
spec:
  interval: 15m
  timeout: 20m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    config:
      enabled: true
      data: {}
    controllers:
      jellyseerr:
        pod:
          securityContext:
            runAsNonRoot: true
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: ghcr.io/fallenbagel/jellyseerr
              tag: 2.7.3@sha256:9cc9e9ee6cd5cf5a23feb45c37742ba34cfd6314d81d259cddb373a97ac92cdd
            env:
              TZ: Europe/Amsterdam
              LOG_LEVEL: info
            ports:
            - name: http
              containerPort: 5055
            securityContext:                           # <-- ADDED
              runAsUser: 1000
              runAsGroup: 1000
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 512Mi
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 5055
                  initialDelaySeconds: 60
                  periodSeconds: 10
                  failureThreshold: 6
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 5055
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  failureThreshold: 5
    service:
      app:
        controller: jellyseerr
        type: ClusterIP
        ports:
          http:
            port: 5055
            targetPort: http
    persistence:
      config:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: jellyseerr-config
        globalMounts:
        - path: /app/config