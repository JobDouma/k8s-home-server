apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
spec:
  interval: 15m
  timeout: 10m
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      uptime-kuma:
        replicas: 1
        pod:
          annotations:
            configmap.reloader.stakater.com/reload: uptime-kuma-monitors
          automountServiceAccountToken: false
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault

        # ── One-time bootstrap + provisioning, before the app starts ──
        initContainers:
          # Ensures the SQLite schema exists. On a fresh PVC it starts
          # Uptime Kuma briefly, waits for the HTTP server on :3001 to
          # answer (which proves SQLite is open and Knex migrations have
          # run), then terminates it. On subsequent boots it exits
          # immediately.
          bootstrap-db:
            image:
              repository: louislam/uptime-kuma
              tag: 2.5.3@sha256:3e24e96c89efff0e3a4b0698cbdd36c15ad3022371db57166e5588853002ee5c
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                cd /app

                # Schema already present? Nothing to do.
                # NOTE: Uptime Kuma bundles `better-sqlite3` (sync API), not the
                # `sqlite3` package — using the wrong module name here silently
                # fails and defeats the skip-check every run.
                if [ -f /app/data/kuma.db ]; then
                  if node -e "
                    const Database = require('better-sqlite3');
                    const db = new Database('/app/data/kuma.db', { readonly: true, fileMustExist: true });
                    const row = db.prepare(\"SELECT 1 FROM sqlite_master WHERE type='table' AND name='monitor'\").get();
                    db.close();
                    process.exit(row ? 0 : 1);
                  " 2>/dev/null; then
                    echo "Schema already present, skipping bootstrap."
                    exit 0
                  fi
                fi

                echo "Starting Uptime Kuma to bootstrap schema..."
                node server/server.js &
                PID=$!

                # Always reap node, even on error.
                trap 'kill -TERM "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true' EXIT

                # Wait until HTTP on :3001 answers. This proves the server,
                # SQLite handle, and Knex migrations are all up — which is
                # more reliable than sniffing kuma.db size under WAL mode.
                node -e "
                  const http = require('http');
                  let i = 0;
                  const check = () => {
                    const req = http.get('http://127.0.0.1:3001/', r => {
                      r.resume();
                      console.log('uptime-kuma responded on :3001');
                      process.exit(0);
                    });
                    req.on('error', () => {
                      if (++i < 90) setTimeout(check, 2000);
                      else { console.error('timeout waiting for :3001'); process.exit(1); }
                    });
                    req.setTimeout(2000, () => req.destroy());
                  };
                  check();
                "

                echo "Giving migrations 10s to settle..."
                sleep 10
                echo "Bootstrap done."
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 256Mi

          # Runs provision.py against the now-initialised DB. Idempotent:
          # skips users/monitors/notifications that already exist, and
          # rolls back cleanly on any unexpected error.
          provision:
            image:
              repository: python
              tag: 3.14-slim@sha256:cad9a2c871761c413caa6fdd6441c783451e740a48aaeba60ae62a8b53525ef6
            command:
              - /bin/sh
              - -c
              - |
                set -eux
                pip install --no-cache-dir --user bcrypt
                exec python3 /scripts/provision.py
            env:
              HOME: /tmp
              UPTIME_KUMA_ADMIN_USER:
                valueFrom:
                  secretKeyRef:
                    name: uptime-kuma-credentials
                    key: admin-user
              UPTIME_KUMA_ADMIN_PASS:
                valueFrom:
                  secretKeyRef:
                    name: uptime-kuma-credentials
                    key: admin-pass
              UPTIME_KUMA_GOTIFY_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: uptime-kuma-credentials
                    key: gotify-token
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 128Mi

        containers:
          app:
            image:
              repository: louislam/uptime-kuma
              tag: 2.5.3@sha256:3e24e96c89efff0e3a4b0698cbdd36c15ad3022371db57166e5588853002ee5c
            env:
              TZ: Europe/Amsterdam
            ports:
              - name: http
                containerPort: 3001
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 256Mi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 3001
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 3001
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  failureThreshold: 3

    service:
      app:
        controller: uptime-kuma
        type: ClusterIP
        ports:
          http:
            port: 3001

    persistence:
      data:
        type: persistentVolumeClaim
        existingClaim: uptime-kuma-data
        globalMounts:
          - path: /app/data

      # ConfigMap holding provision.py, mounted into the `provision` init container
      scripts:
        type: configMap
        name: uptime-kuma-monitors
        globalMounts:
          - path: /scripts/provision.py
            subPath: provision.py
            readOnly: true