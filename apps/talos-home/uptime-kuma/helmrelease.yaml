apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
spec:
  interval: 15m
  timeout: 10m
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 0
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      uptime-kuma:
        replicas: 1
        pod:
          annotations:
            configmap.reloader.stakater.com/reload: uptime-kuma-monitors
          automountServiceAccountToken: false
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
        initContainers:
          bootstrap-db:
            image:
              repository: louislam/uptime-kuma
              tag: 2.5.5@sha256:c74379ac4509ce2d2c2633f509e67003ee2e45b6e995c5e43fc101f45a0e1fbe
            command:
            - /bin/sh
            - -c
            - "set -eu\ncd /app\n\nif [ -f /app/data/kuma.db ]; then\n  if node -e\
              \ \"\n    const Database = require('better-sqlite3');\n    const db\
              \ = new Database('/app/data/kuma.db', { readonly: true, fileMustExist:\
              \ true });\n    const row = db.prepare(\\\"SELECT 1 FROM sqlite_master\
              \ WHERE type='table' AND name='monitor'\\\").get();\n    db.close();\n\
              \    process.exit(row ? 0 : 1);\n  \" 2>/dev/null; then\n    echo \"\
              Schema already present, skipping bootstrap.\"\n    exit 0\n  fi\nfi\n\
              \necho \"Starting Uptime Kuma to bootstrap schema...\"\nnode server/server.js\
              \ &\nPID=$!\ntrap 'kill -TERM \"$PID\" 2>/dev/null || true; wait \"\
              $PID\" 2>/dev/null || true' EXIT\n\nnode -e \"\n  const http = require('http');\n\
              \  let i = 0;\n  const check = () => {\n    const req = http.get('http://127.0.0.1:3001/',\
              \ r => {\n      r.resume();\n      console.log('uptime-kuma responded\
              \ on :3001');\n      process.exit(0);\n    });\n    req.on('error',\
              \ () => {\n      if (++i < 90) setTimeout(check, 2000);\n      else\
              \ { console.error('timeout waiting for :3001'); process.exit(1); }\n\
              \    });\n    req.setTimeout(2000, () => req.destroy());\n  };\n  check();\n\
              \"\n\necho \"Giving migrations 10s to settle...\"\nsleep 10\necho \"\
              Bootstrap done.\"\n"
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 256Mi
          provision:
            image:
              repository: python
              tag: 3.14-slim@sha256:ef30e8ee3a7f227b0b5b39669b2e656f35b56b918c6631820357c2a55ff5a428
            command:
            - /bin/sh
            - -c
            - |
              set -uex
              if ! pip install --no-cache-dir --user --only-binary=:all: bcrypt==4.2.0; then
                echo "PIP INSTALL FAILED — sleeping for debug" >&2
                sleep 3600
                exit 1
              fi
              if ! python3 /scripts/provision.py; then
                echo "PROVISION.PY FAILED — sleeping for debug" >&2
                sleep 3600
                exit 1
              fi
            env:
              HOME: /tmp
              UPTIME_KUMA_ADMIN_USER:
                valueFrom:
                  secretKeyRef:
                    name: uptime-kuma-credentials
                    key: admin-user
              UPTIME_KUMA_ADMIN_PASS:
                valueFrom:
                  secretKeyRef:
                    name: uptime-kuma-credentials
                    key: admin-pass
              UPTIME_KUMA_GOTIFY_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: uptime-kuma-credentials
                    key: gotify-token
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 128Mi
        containers:
          app:
            image:
              repository: louislam/uptime-kuma
              tag: 2.5.5@sha256:c74379ac4509ce2d2c2633f509e67003ee2e45b6e995c5e43fc101f45a0e1fbe
            env:
              TZ: Europe/Amsterdam
            ports:
            - name: http
              containerPort: 3001
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 256Mi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 3001
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 3001
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  failureThreshold: 3
    service:
      app:
        controller: uptime-kuma
        type: ClusterIP
        ports:
          http:
            port: 3001
    persistence:
      data:
        type: persistentVolumeClaim
        existingClaim: uptime-kuma-data
        globalMounts:
        - path: /app/data
      scripts:
        type: configMap
        name: uptime-kuma-monitors
        globalMounts:
        - path: /scripts/provision.py
          subPath: provision.py
          readOnly: true