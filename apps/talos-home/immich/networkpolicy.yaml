apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: immich
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: immich-server
  namespace: immich
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: immich-server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
      ports:
        - port: 2283
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 2283
  egress:
    # Allow egress to PostgreSQL and Redis pods directly (pod IPs)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: immich-postgres
      ports:
        - port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: immich-redis
      ports:
        - port: 6379
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: immich-machine-learning
      ports:
        - port: 3003
    # NEW: allow egress to the service CIDR on ports 5432 and 6379
    # This ensures connections via ClusterIP services work.
    - to:
        - ipBlock:
            cidr: 10.96.0.0/16
      ports:
        - port: 5432
        - port: 6379
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Kubernetes API server
    - to:
        - ipBlock:
            cidr: 10.96.0.1/32
      ports:
        - port: 443
    # Pod CIDR for internal communication
    - to:
        - ipBlock:
            cidr: 10.244.0.0/16
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: immich-postgres
  namespace: immich
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: immich-postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: immich-server
      ports:
        - port: 5432
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: immich-redis
  namespace: immich
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: immich-redis
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: immich-server
      ports:
        - port: 6379
  egress: []