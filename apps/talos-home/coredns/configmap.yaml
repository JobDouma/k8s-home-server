apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health {
            lameduck 5s
        }
        ready

        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
        }

        # .lan goes to Blocky using its ClusterIP
        forward lan 10.102.205.119 {
            policy sequential
            max_fails 3
            expire 30s
            health_check 5s
        }

        # All other DNS goes to Blocky first, fallback to public resolvers
        forward . 10.102.205.119 1.1.1.1 8.8.8.8 {
            policy sequential
            max_fails 3
            expire 30s
            health_check 5s
            prefer_udp
        }

        cache 300
        loop
        reload
        loadbalance
    }