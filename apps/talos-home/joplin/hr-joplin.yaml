apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: joplin
  namespace: joplin
spec:
  interval: 15m
  timeout: 20m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      strategy: uninstall
      retries: 3
  dependsOn:
    - name: joplin-postgres
      namespace: joplin
  chart:
    spec:
      chart: app-template
      version: "5.1.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      joplin:
        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
        initContainers:
          fix-perms:                                # changed from array to map
            image: busybox
            command:
              - sh
              - -c
              - |
                mkdir -p /home/joplin/.pm2 /home/joplin/packages/server/logs /home/joplin/packages/server/temp
                chown -R 1000:1000 /home/joplin/.pm2 /home/joplin/packages/server/logs /home/joplin/packages/server/temp
            securityContext:
              runAsUser: 0
            volumeMounts:
              - name: pm2
                mountPath: /home/joplin/.pm2
              - name: logs
                mountPath: /home/joplin/packages/server/logs
              - name: temp
                mountPath: /home/joplin/packages/server/temp
        containers:
          app:
            image:
              repository: joplin/server
              tag: 3.7.1@sha256:0877bfba41a943017c42c58e90db9d8d548bfe699b5e410248b5b879371734f9
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi
            ports:
            - name: http
              containerPort: 22300
              protocol: TCP
            env:
              APP_BASE_URL: https://joplin.lan
              APP_PORT: "22300"
              APP_LISTEN_ADDRESS: 0.0.0.0
              DB_CLIENT: pg
              POSTGRES_HOST: joplin-postgres
              POSTGRES_PORT: "5432"
              SIGNUP_ENABLED: "0"
              PM2_HOME: /home/joplin/.pm2
              TZ: Europe/Amsterdam
            envFrom:
            - secretRef:
                name: joplin-secret
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              runAsNonRoot: true
            probes:                                   # moved probes here
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/ping
                    port: 22300
                  failureThreshold: 30
                  periodSeconds: 10
                  initialDelaySeconds: 10
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/ping
                    port: 22300
                  initialDelaySeconds: 120
                  periodSeconds: 30
                  failureThreshold: 10
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/ping
                    port: 22300
                  initialDelaySeconds: 60
                  periodSeconds: 10
                  failureThreshold: 10
                  timeoutSeconds: 5
    service:
      app:
        controller: joplin
        type: ClusterIP
        ports:
          http:
            port: 22300
            targetPort: http
    persistence:
      pm2:
        enabled: true
        type: emptyDir
        advancedMounts:
          joplin:
            app:
            - path: /home/joplin/.pm2
      logs:
        enabled: true
        type: emptyDir
        advancedMounts:
          joplin:
            app:
            - path: /home/joplin/packages/server/logs
      temp:
        enabled: true
        type: emptyDir
        advancedMounts:
          joplin:
            app:
            - path: /home/joplin/packages/server/temp