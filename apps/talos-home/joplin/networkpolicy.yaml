apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: joplin
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: joplin
  namespace: joplin
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: joplin
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: networking
      ports:
        - port: 22300
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: joplin-postgres
      ports:
        - port: 5432
    # NTP (UDP 123)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 123
          protocol: UDP
    # API server (if needed)
    - to:
        - ipBlock:
            cidr: 10.96.0.1/32
      ports:
        - port: 443
    # Allow egress to pod network for internal communication
    - to:
        - ipBlock:
            cidr: 10.244.0.0/16
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: joplin-postgres
  namespace: joplin
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: joplin-postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: joplin
      ports:
        - port: 5432
  egress: []