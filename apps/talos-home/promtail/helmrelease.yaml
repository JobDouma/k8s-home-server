apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: promtail
  namespace: monitoring
spec:
  interval: 30m
  timeout: 20m
  dependsOn:
    - name: loki
      namespace: monitoring

  chart:
    spec:
      chart: promtail
      version: "6.17.1"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system

  values:
    tolerations:
      - operator: Exists

    config:
      clients:
        - url: http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push   # corrected

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

    defaultVolumes:
      - name: pods
        hostPath:
          path: /var/log/pods
      - name: run
        hostPath:
          path: /run/promtail

    defaultVolumeMounts:
      - name: pods
        mountPath: /var/log/pods
        readOnly: true
      - name: run
        mountPath: /run/promtail

    extraVolumes: []
    extraVolumeMounts: []