apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gotify
  namespace: gotify
spec:
  interval: 15m
  timeout: 20m
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: app-template
      version: "5.1.0"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      gotify:
        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
        initContainers:
          fix-perms:
            image:
              repository: busybox
              tag: 1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
            command:
            - sh
            - -c
            - chown -R 1000:1000 /app/data
            securityContext:
              runAsUser: 0
              runAsNonRoot: false
            volumeMounts:
            - name: data
              mountPath: /app/data
        containers:
          app:
            image:
              repository: gotify/server
              tag: "3.1.0@sha256:be44495e4609c6f5b06c01a9445ec6198dba902ce49fc3d0d71ab585cda8014c"
            env:
              TZ: Europe/Amsterdam
              GOTIFY_DEFAULTUSER_NAME:
                valueFrom:
                  secretKeyRef:
                    name: gotify-secret
                    key: admin-user
              GOTIFY_DEFAULTUSER_PASS:
                valueFrom:
                  secretKeyRef:
                    name: gotify-secret
                    key: admin-password
            ports:
            - name: http
              containerPort: 80
              protocol: TCP
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 80
                  initialDelaySeconds: 30
                  periodSeconds: 5
                  failureThreshold: 6
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 80
                  initialDelaySeconds: 60
                  periodSeconds: 10
                  failureThreshold: 5
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
    service:
      app:
        controller: gotify
        type: ClusterIP
        ports:
          http:
            port: 80
            targetPort: http
    persistence:
      data:
        type: persistentVolumeClaim
        storageClass: local-path
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
        - path: /app/data